name: Sync reviews and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      inspect_schema:
        description: Check question IDs and labels without fetching answers or publishing
        type: boolean
        default: false
  schedule:
    # Daily at 3:17 AM Pacific; avoid the busiest scheduler window on the hour.
    - cron: '17 3 * * *'
      timezone: America/Los_Angeles

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'schedule' || vars.FILLOUT_SYNC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.publish.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Queued runs must start from current main, including data committed by
          # a previous sync, instead of deploying an older event snapshot.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test review processing
        run: python -m unittest discover -s tests -v
      - name: Check Fillout connection
        id: connection
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FILLOUT_API_KEY: ${{ secrets.FILLOUT_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$FILLOUT_API_KEY" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = 'schedule' ] || [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo '::error::Add the private FILLOUT_API_KEY repository secret before syncing.'
            exit 1
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Fillout is not connected yet; building the existing snapshot.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fetch and validate completed reviews
        id: sync
        if: steps.connection.outputs.available == 'true' && !inputs.inspect_schema
        env:
          FILLOUT_API_KEY: ${{ secrets.FILLOUT_API_KEY }}
        run: python scripts/sync_fillout.py
      - name: Inspect public form structure only
        if: steps.connection.outputs.available == 'true' && inputs.inspect_schema
        env:
          FILLOUT_API_KEY: ${{ secrets.FILLOUT_API_KEY }}
        run: python scripts/sync_fillout.py --inspect-schema
      - name: Decide whether to publish
        id: publish
        if: '!inputs.inspect_schema'
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATA_CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          if [ "$EVENT_NAME" != 'schedule' ] || [ "$DATA_CHANGED" = 'true' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.publish.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: map/package-lock.json
      - run: npm ci --prefix map
        if: steps.publish.outputs.enabled == 'true'
      - run: npm run build --prefix map
        if: steps.publish.outputs.enabled == 'true'
      - name: Save only public review data
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/apartments.json static/data-status.json config/fillout.json
          git commit -m 'Update published apartment reviews'
          # A conflicting main update stops this run before deployment. The next
          # scheduled run will retry from the latest main.
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@v4
        if: steps.publish.outputs.enabled == 'true'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
